name: High-Frequency Trading Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: High-Frequency-Trading-Engine

jobs:
  engine-build-and-test:
    name: Engine (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cxx: g++
          - os: ubuntu-24.04
            compiler: clang
            cxx: clang++
          - os: macos-14
            compiler: appleclang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure integrated engine (-Werror)
        run: |
          cmake -S engine -B build/engine \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DHFT_WERROR=ON \
            -DHFT_PROJECTS_ROOT="${GITHUB_WORKSPACE}/projects"
      - name: Build integrated engine
        run: cmake --build build/engine --parallel
      - name: Run engine contract, integration, failure, and golden tests
        run: ctest --test-dir build/engine --output-on-failure --verbose
      - name: Verify deterministic golden checksum and scenarios
        run: |
          ./build/engine/hft_demo --mode deterministic --scenario single-venue \
            --verify-golden engine/tests/golden/single_venue.golden.json
          ./build/engine/hft_demo --mode deterministic --scenario all
          ./build/engine/hft_demo --mode network-lab --scenario all --live-sockets

  engine-sanitizers:
    name: Engine Sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize:
          - address,undefined
          - thread
    steps:
      - uses: actions/checkout@v4
      - name: Configure with -DHFT_SANITIZE=${{ matrix.sanitize }}
        run: |
          cmake -S engine -B build/san \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHFT_WERROR=ON \
            -DHFT_SANITIZE=${{ matrix.sanitize }} \
            -DHFT_PROJECTS_ROOT="${GITHUB_WORKSPACE}/projects"
      - name: Build
        run: cmake --build build/san --parallel
      - name: Test under ${{ matrix.sanitize }}
        run: ctest --test-dir build/san --output-on-failure --verbose

  performance-artifacts-non-gating:
    name: Performance Collection (Non-Gating Artifact)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark suite (informational only; shared CI hosts are noisy)
        env:
          HFT_PROJECTS_ROOT: ${{ github.workspace }}/projects
        run: |
          chmod +x scripts/run_benchmarks.sh
          ./scripts/run_benchmarks.sh integration/results/ci_linux
      - uses: actions/upload-artifact@v4
        with:
          name: hft-bench-linux-artifacts
          path: High-Frequency-Trading-Engine/integration/results/ci_linux/
