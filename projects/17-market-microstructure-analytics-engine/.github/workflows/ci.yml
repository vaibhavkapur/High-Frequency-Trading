name: MMAE CI Validation

on:
  push:
    paths:
      - "projects/17-market-microstructure-analytics-engine/**"
  pull_request:
    paths:
      - "projects/17-market-microstructure-analytics-engine/**"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-market-microstructure-analytics-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional Polars and pytest
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and run C++ & Python validation suites
        run: |
          chmod +x scripts/run_validation.sh scripts/run_demo.sh
          ./scripts/run_validation.sh

      - name: Run reproducible end-to-end demo & benchmark
        run: |
          ./scripts/run_demo.sh
