# Naive symmetric baseline configuration (identical latency, fees, and risk limits)
strategy = naive_symmetric
book_impl = flat_array
fill_model = queue_priority

tick_size_dollars = 0.01
md_latency_us = 100
order_latency_us = 150
ack_latency_us = 100

maker_fee_bps = -0.2
taker_fee_bps = 1.5
cancel_fee_dollars = 0.0

max_abs_position = 500
max_order_size = 100
max_gross_notional_dollars = 150000.0
max_drawdown_dollars = 1500.0
max_open_orders = 4

base_half_spread_ticks = 1.0
min_half_spread_ticks = 1.0
base_quote_qty = 100
requote_threshold_ticks = 1
min_quote_lifetime_ms = 5
post_only = true
