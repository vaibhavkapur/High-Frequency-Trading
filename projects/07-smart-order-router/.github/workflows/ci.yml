name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-gcc
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: "OFF"
          - name: asan-ubsan-clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitize: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSOR_SANITIZE=${{ matrix.sanitize }} \
            -DSOR_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke CLI & Demo
        if: matrix.sanitize == 'OFF'
        run: |
          ./build/sor --help
          ./scripts/demo.sh

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        run: ./scripts/format.sh --check
