# Liquidity-taking baseline: trade in the direction of top-of-book imbalance.

[run]
data = examples/data/sample_l3.csv
out_dir = results/sample_imbalance
sample_interval_ns = 100000000
markout_horizons_ns = 1000000, 100000000, 1000000000

[latency]
md_delay_ns = 50000
compute_delay_ns = 5000
order_delay_ns = 100000
response_delay_ns = 100000

[exchange]
taker_slippage_ticks = 0

[fees]
maker_bps = -0.1
taker_bps = 0.3

[risk]
max_order_qty = 100
max_position = 100
max_open_orders = 10

[strategy]
name = imbalance
threshold = 0.6
order_qty = 5
max_position = 20
cooldown_ns = 1000000
max_hold_ns = 2000000000
