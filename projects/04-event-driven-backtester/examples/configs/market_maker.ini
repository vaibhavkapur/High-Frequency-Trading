# Two-sided quoting baseline on the bundled synthetic L3 fixture.
# Run from the repository root:  build/hftbt run --config examples/configs/market_maker.ini

[run]
data = examples/data/sample_l3.csv
out_dir = results/sample_market_maker
seed = 1                                  # only affects latency jitter
sample_interval_ns = 100000000            # equity curve every 100 ms
markout_horizons_ns = 1000000, 100000000, 1000000000

[latency]
md_delay_ns = 50000                       # exchange -> strategy market data
md_jitter_ns = 10000
compute_delay_ns = 5000                   # strategy think time
order_delay_ns = 100000                   # strategy -> exchange
order_jitter_ns = 20000
response_delay_ns = 100000                # exchange -> strategy acks/fills
response_jitter_ns = 20000

[exchange]
queue_model = conservative                # only matters for L2 feeds
fill_on_crossing_quote = true
taker_slippage_ticks = 0

[fees]
maker_bps = -0.1                          # negative = rebate
taker_bps = 0.3

[risk]
max_order_qty = 100
max_position = 100
max_open_orders = 10

[strategy]
name = market_maker
half_spread_ticks = 2
order_qty = 10
max_position = 50
skew_ticks_per_lot = 0.05
requote_threshold_ticks = 1
min_requote_interval_ns = 0
post_only = true
